# BEGIN CAREERLOOP GRAPH
# /path/to/edge-proxy/infra/nginx.conf 의 http { } 블록 안, 마지막 "}" 바로 위에 붙인다.
# Neo4j Browser(HTTP 7474)와 Browser의 Bolt 웹소켓(7687, TLS)을 443으로 연다. careerloop-graph는 cbt_bank_default 네트워크에 붙어 있다.
# 앱(Vercel)의 Bolt 드라이버는 nginx를 거치지 않고 bolt+s://graph.example.com:7697 로 직접 붙는다.
upstream careerloop_graph_http {
    zone careerloop_graph_http 64k;
    server careerloop-graph:7474 resolve;
}

upstream careerloop_graph_bolt {
    zone careerloop_graph_bolt 64k;
    server careerloop-graph:7687 resolve;
}

server {
    listen 80;
    server_name graph.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://graph.example.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name graph.example.com;

    ssl_certificate /etc/letsencrypt/live/graph.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graph.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        # Neo4j Browser가 Bolt를 웹소켓(Upgrade)으로 붙으면 Bolt 포트로, 그 밖은 HTTP 포트로 보낸다.
        if ($http_upgrade = "websocket") {
            proxy_pass https://careerloop_graph_bolt;
        }
        proxy_pass http://careerloop_graph_http;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name graph.example.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
# END CAREERLOOP GRAPH
