# BEGIN CAREERLOOP WORKER
# /path/to/edge-proxy/infra/nginx.conf 의 http { } 블록 안, 마지막 "}" 바로 위에 붙인다.
# WORKER_DOMAIN 은 연결한 도메인으로 바꾼다(README.md 2단계의 sed 명령).
# careerloop-worker(FastAPI, :8090)는 cbt_bank_default 네트워크에 붙어 있다. 워커 인증은 HMAC(앱)이 하고, 여기서는 크기·속도만 막는다.

# 요청 속도 제한(IP당). Vercel 디스패치는 작업 1건당 요청 1번이라 넉넉하다.
# $binary_remote_addr가 실제 클라이언트 IP여야 한다 — 이 도메인은 Cloudflare 프록시를 끄고(DNS only) 쓴다. 프록시를 켜면 모든 요청이
# Cloudflare IP 몇 개로 보여 한 버킷을 나눠 쓰게 되고, 누구나 서명 없는 요청으로 Vercel 디스패치를 429로 막을 수 있다(아래 서버 블록의 real_ip 주석 참고).
limit_req_zone $binary_remote_addr zone=careerloop_worker:10m rate=10r/s;
# 공개 경로(/healthz) 전용 버킷 — 서명된 디스패치와 버킷을 나누지 않는다.
limit_req_zone $binary_remote_addr zone=careerloop_worker_public:10m rate=2r/s;

# 서명 헤더가 없는 요청은 nginx가 바로 401로 돌려보낸다(rewrite 단계 — 속도 제한 버킷·워커를 쓰지 않는다). 서명 검증 자체는 앱(HMAC)이 한다.
map $http_x_worker_signature $careerloop_worker_unsigned {
    ""      1;
    default 0;
}

upstream careerloop_worker {
    zone careerloop_worker_upstream 64k;
    server careerloop-worker:8090 resolve;
}

server {
    listen 80;
    server_name WORKER_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://WORKER_DOMAIN$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name WORKER_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/WORKER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/WORKER_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 본문은 {id, runId}뿐이다. 64KB를 넘으면 413.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    limit_req_status 429;

    # Cloudflare 프록시를 꼭 켜야 한다면(권장하지 않음) 아래 주석을 풀어 실제 클라이언트 IP로 속도 제한을 건다.
    # set_real_ip_from 목록은 https://www.cloudflare.com/ips/ 의 IPv4·IPv6 대역 전부로 채우고, 바뀌면 다시 맞춘다.
    # set_real_ip_from 173.245.48.0/20;
    # ... (Cloudflare 대역 전부)
    # real_ip_header CF-Connecting-IP;

    # 공개 경로는 /healthz 하나(내용 없음).
    location = /healthz {
        limit_req zone=careerloop_worker_public burst=10 nodelay;
        proxy_pass http://careerloop_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 나머지(/readyz, /v1/jobs/*)는 앱이 HMAC으로 막는다. 서명 헤더가 없으면 여기서 바로 401.
    location / {
        if ($careerloop_worker_unsigned) {
            return 401;
        }
        limit_req zone=careerloop_worker burst=40 nodelay;
        proxy_pass http://careerloop_worker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 워커는 작업을 큐에 넣고 바로 202를 돌려준다(디스패치 타임아웃 5초).
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
# END CAREERLOOP WORKER
