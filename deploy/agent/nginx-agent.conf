# 에이전트 실행기 프록시 — cbt-nginx의 워커 서버 블록(deploy/worker/nginx-worker.conf, server_name WORKER_DOMAIN, 443) 안에
# `location / { ... }` 보다 앞에 붙여 넣는다. 같은 도메인·인증서를 쓰고 경로 하나만 실행기로 보낸다.
# Vercel의 RESUME_AGENT_RUNNER_URL은 https://WORKER_DOMAIN 이 된다.
#
# http 블록(서버 블록 밖)에 한 번:
#   map $http_x_agent_signature $careerloop_agent_unsigned { "" 1; default 0; }
#   upstream careerloop_agent { zone careerloop_agent_upstream 64k; server careerloop-agent:3000 resolve; }

    # BEGIN CAREERLOOP AGENT
    # 서명된 이어 가기 호출 하나만 연다. 앱이 HMAC(RESUME_AGENT_CHAIN_SECRET)으로 확인하고, 서명 헤더가 없으면 여기서 바로 401.
    location = /api/internal/resume-agent/advance {
        if ($careerloop_agent_unsigned) {
            return 401;
        }
        limit_except POST { deny all; }
        limit_req zone=careerloop_worker burst=40 nodelay;
        proxy_pass http://careerloop_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 실행기는 바로 202를 돌려주고 응답 뒤에 실행한다(Vercel 쪽 타임아웃 5초).
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    # END CAREERLOOP AGENT
