# 개발용 서비스. 로컬 루프백에만 연다. `docker compose -p resume-career up -d postgres`(또는 `npm run db:up`).
# - postgres: 앱 DB(운영은 Supabase PostgreSQL). DATABASE_URL=postgresql://postgres:<POSTGRES_PASSWORD>@127.0.0.1:54329/careerloop
# - neo4j: 경력·경험 그래프(선택). NEO4J_PASSWORD가 필요하다(`docker compose -p resume-career --env-file .env.local up -d neo4j`).
#   Compose는 시작하지 않는 서비스의 변수도 치환하므로(profiles로도 건너뛰지 않는다) `:?`로 막지 않고,
#   비어 있으면 neo4j 컨테이너 시작 시점에 실패시킨다. 그래서 postgres만 띄울 때는 NEO4J_PASSWORD가 없어도 된다.
services:
  postgres:
    image: postgres:17-alpine
    ports:
      # 호스트 포트가 이미 쓰이고 있으면 POSTGRES_PORT로 바꾼다(DATABASE_URL의 포트도 같이).
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerloop-dev}
      POSTGRES_DB: careerloop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careerloop"]
      interval: 5s
      timeout: 3s
      retries: 10
  neo4j:
    image: neo4j:5-community
    # 이미지 기본 ENTRYPOINT(tini -g -- /startup/docker-entrypoint.sh) 앞에 비밀번호 확인만 덧붙인다.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${NEO4J_AUTH#neo4j/}" ]; then
          echo "NEO4J_PASSWORD가 비어 있습니다. .env.local에 설정하고 --env-file .env.local로 시작하세요." >&2
          exit 1
        fi
        exec tini -g -- /startup/docker-entrypoint.sh "$$@"
      - neo4j-entrypoint
    command: ["neo4j"]
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
volumes:
  postgres-data:
  neo4j-data:
